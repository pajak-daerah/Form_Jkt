<!DOCTYPE html>
<html lang="id">
<head>

<style>
:root{--bg:#eef1f5;--paper:#fff;--ink:#111;--line:#222;--acc:#0f4c81;--mut:#5b6572;--fld:#e6d9f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--mut:#9aa6b4;--acc:#6db3f2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px/1.4 Arial,Helvetica,sans-serif;color:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--acc);color:#fff}
.bar b{flex:1;min-width:180px}
.bar button{border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;background:#fff;color:#0f4c81}
.wrap{overflow-x:auto;padding:14px}
.paper{width:820px;margin:0 auto;background:#fff;color:#111;border:1px solid #bbb;padding:18px 22px;box-shadow:0 2px 10px #0002}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #000;padding:3px 5px;vertical-align:top;font-weight:400}
.bd th{font-weight:700;text-align:center;vertical-align:middle}
.bd td:first-child{text-align:center;width:34px}
.sec{background:#fff;font-weight:700;padding:3px 5px;border:1px solid #000;border-top:0}
.sec.f{border-top:1px solid #000}
input,textarea,select{font:inherit;color:#111;color-scheme:light;background:var(--fld);border:0;border-bottom:1px dotted #888;padding:2px 4px;width:100%;outline:0;display:block}
select option,select optgroup{background:#fff;color:#111}
textarea{resize:vertical;min-height:44px}
input:focus,textarea:focus,select:focus{background:#d6c2f0}
.ck{display:flex;align-items:center;gap:6px;cursor:pointer}
.ck input{display:inline-block;width:auto;margin:0}
.id td{border:0;padding:2px 4px}.id td:first-child{width:150px}.id td:nth-child(2){width:12px}
.warn{color:#c00000;font-weight:700;font-style:italic}
.judul{margin:14px 0 8px;font-weight:700;text-align:center}
.note{color:var(--mut);font-size:12px;max-width:820px;margin:8px auto}
@media print{
 :root{padding:0}body{background:#fff}.bar,.note{display:none}.wrap{padding:0;overflow:visible}
 .paper{border:0;box-shadow:none;width:100%;padding:0}
 input,textarea,select{background:transparent!important;color:#111!important;border-bottom:0}
 @page{size:215mm 330mm;margin:12mm}
}

</style>

<body>

<button onclick="tampil()">Tampilkan</button><button onclick="reset()">Kosongkan</button><button id="bpdf" onclick="simpanPDF()">Simpan PDF</button><button id="bctk" onclick="cetak()">Cetak</button></div>
<div class="wrap"><div class="paper" id="f"></div></div>
<p class="note">Isi langsung pada formulir. Tanda tangan pemohon dibubuhkan setelah dicetak. Klik “Tampilkan” untuk melihat hasilnya (bisa di-zoom) dan “Simpan PDF” untuk menyimpannya sebagai PDF (ukuran F4).</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>window.jspdf||document.write('<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"><\/script>')</script>
<script>
const $=id=>document.getElementById(id);
const PW=612,PH=936; /* F4 */
const NB=11; /* jumlah baris bidang */
const FJ={A:['helvetica','normal'],AB:['helvetica','bold'],AI:['helvetica','italic'],T:['times','normal'],TB:['times','bold']};
const KA=['Jakarta Pusat','Jakarta Utara','Jakarta Barat','Jakarta Selatan','Jakarta Timur'];
const UP=[['Jakarta Pusat',['Gambir','Tanah Abang','Menteng','Senen','Cempaka Putih','Johar Baru','Kemayoran','Sawah Besar']],['Jakarta Utara',['Penjaringan','Tanjung Priok','Pademangan','Koja','Cilincing','Kelapa Gading']],['Jakarta Barat',['Cengkareng','Grogol Petamburan','Kalideres','Kebon Jeruk','Kembangan','Palmerah','Taman Sari','Tambora']],['Jakarta Selatan',['Kebayoran Baru','Kebayoran Lama','Pesanggrahan','Cilandak','Pasar Minggu','Jagakarsa','Mampang Prapatan','Pancoran','Tebet','Setiabudi']],['Jakarta Timur',['Matraman','Pulo Gadung','Jatinegara','Duren Sawit','Kramat Jati','Makasar','Pasar Rebo','Ciracas','Cipayung','Cakung']]];
const ids=()=>[...document.querySelectorAll('#f input,#f textarea,#f select')];

/* ---------- formulir ---------- */
const opt=a=>a.map(g=>typeof g==='string'?'<option>'+g+'</option>':'<optgroup label="'+g[0]+'">'+g[1].map(n=>'<option>'+n+'</option>').join('')+'</optgroup>').join('');
const SEL=(id,o,ne)=>'<select id="'+id+'">'+(ne?'':'<option value="">— Pilih —</option>')+o+'</select>';
const I=(id,x)=>'<input id="'+id+'" '+(x||'')+'>';
const TA=id=>'<textarea id="'+id+'" rows="2"></textarea>';
const R=(l,c)=>'<tr><td>'+l+'</td><td>:</td><td>'+c+'</td></tr>';
const SEC=(t,f)=>'<div class="sec'+(f?' f':'')+'">'+t+'</div>';
const TB=r=>'<table class="id" style="border:1px solid #000;border-top:0">'+r+'</table>';
const HD=(t,cls)=>'<tr><td colspan="3"'+(cls?' class="'+cls+'"':'')+'><b>'+t+'</b></td></tr>';
function build(){
 let h='<div class="judul">SURAT PERMOHONAN PEMECAHAN PBB-P2</div>';
 h+=SEC('Surat',1)+TB(R('Wilayah UPPPD',SEL('upp',opt(UP)))+R('Kota administrasi',SEL('adm',opt(KA)))+R('Tanggal',I('tgl','type="date" style="width:170px"')));
 h+=SEC('Wajib pajak (pemohon)')+TB(R('Pemohon sebagai',SEL('pem',opt(['Wajib Pajak','Kuasa Wajib Pajak']),1))+R('Nama Kuasa/Wajib Pajak',I('nama'))+R('No. KTP',I('ktp','inputmode="numeric" maxlength="16"'))+R('No. Telp / HP',I('telp','type="tel"'))+R('Nama penandatangan',I('ttd','placeholder="kosong = nama pemohon"')));
 h+=SEC('Objek pajak')+TB(R('NOP PBB-P2 (18 digit)',I('nop','inputmode="numeric" placeholder="00.00.000.000.000-0000.0"'))+R('SPPT PBB atas nama',I('an'))+R('Letak objek pajak',TA('lokasi')));
 h+=SEC('Permohonan pemecahan')+TB(R('Untuk tahun',I('tahun','inputmode="numeric" maxlength="4" style="width:120px"'))+R('Dipecah menjadi (bidang)',I('jml','inputmode="numeric" maxlength="2" placeholder="kosong = otomatis dari tabel" style="width:260px"')));
 h+=SEC('Daftar bidang objek pajak hasil pemecahan');
 let t='<table class="bd" style="border:1px solid #000;border-top:0"><tr><th rowspan="2">No.</th><th rowspan="2">Nama Wajib Pajak</th><th colspan="2">Luas (M2)</th><th rowspan="2">Keterangan</th></tr><tr><th style="width:100px">Tanah</th><th style="width:100px">Bangunan</th></tr>';
 for(let i=1;i<=NB;i++)t+='<tr><td>'+i+'</td><td>'+I('bn_'+i)+'</td><td>'+I('bt_'+i,'inputmode="decimal"')+'</td><td>'+I('bb_'+i,'inputmode="decimal"')+'</td><td>'+I('bk_'+i)+'</td></tr>';
 h+=t+'</table>';
 h+=SEC('Alasan pengajuan permohonan pemecahan PBB')+TB('<tr><td colspan="3">'+TA('alasan')+'</td></tr>');
 $('f').innerHTML=h}
function today(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function defaults(){ids().forEach(x=>{if(x.type==='checkbox')x.checked=false;else if(x.tagName==='SELECT')x.selectedIndex=0;else x.value=''});$('tgl').value=today()}
function reset(){if(confirm('Kosongkan semua isian?'))defaults()}
function fmtNop(s){const d=s.replace(/\D/g,'').slice(0,18),p=[2,2,3,3,3,4,1],o=[];let i=0;
 p.forEach(n=>{const c=d.substr(i,n);i+=n;if(c)o.push(c)});
 return o.length>=6?o.slice(0,5).join('.')+'-'+o[5]+(o[6]?'.'+o[6]:''):o.join('.')}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nop')t.value=fmtNop(t.value);
 if(t.id==='ktp'||t.id==='jml'||t.id==='tahun')t.value=t.value.replace(/\D/g,'')});
function vals(){const V={};ids().forEach(x=>{if(!x.id)return;
 if(x.type==='checkbox'){V[x.id]=x.checked;return}
 let v=x.value.replace(/\s+/g,' ').trim();
 if(v&&x.type==='date'){const d=new Date(v+'T00:00:00');v=d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
 V[x.id]=v});
 V.rows=[];let c=0;
 for(let i=1;i<=NB;i++){const r={n:V['bn_'+i]||'',t:V['bt_'+i]||'',b:V['bb_'+i]||'',k:V['bk_'+i]||''};if(r.n||r.t||r.b||r.k)c++;V.rows.push(r)}
 V.jml=V.jml||(c?String(c):'');V.kota='Jakarta';return V}

/* ---------- tata letak surat (F4) ---------- */
function lay(B,V,b){
 const L=40,R=PW-40,CW=R-L,SZ=b,LH=b*1.34;let y=38,over=false;
 const W=(s,sz=SZ,f='A')=>B.w(s,sz,f);
 const T=(s,x,yy,sz=SZ,f='A')=>B.text(s,x,yy,sz,f);
 const dots=n=>'.'.repeat(n);
 const wrap=(s,mw,sz=SZ,f='A')=>{const out=[];let cur='';
  s.split(/\s+/).filter(Boolean).forEach(w=>{
   while(W(w,sz,f)>mw){let i=w.length-1;while(i>1&&W(w.slice(0,i),sz,f)>mw)i--;if(cur){out.push(cur);cur=''}out.push(w.slice(0,i));w=w.slice(i)}
   const t=cur?cur+' '+w:w;if(!cur||W(t,sz,f)<=mw)cur=t;else{out.push(cur);cur=w}});
  if(cur)out.push(cur);return out};
 const segW=(sg,sz,f)=>sg.reduce((a,s)=>a+W(s.t,sz,f),0);
 const segs=(x,yy,sg,sz,f)=>{let cx=x;sg.forEach(s=>{T(s.t,cx,yy,sz,f);const w=W(s.t,sz,f);if(s.s)B.line(cx,yy-sz*.3,cx+w,yy-sz*.3,.6);cx+=w});return cx-x};
 const C=(s,cx,yy,sz=SZ,f='A')=>T(s,cx-W(s,sz,f)/2,yy,sz,f);
 /* bungkus teks bersegmen (dengan coretan) per kata */
 const wseg=(sg,mw,sz=SZ,f='A')=>{const lines=[];let cur=[],cw=0;const sp=W(' ',sz,f);
  sg.forEach(s=>{s.t.split(/\s+/).filter(Boolean).forEach(w=>{
   const ww=W(w,sz,f);let first=!cur.length,add=(first?0:sp)+ww;
   if(!first&&cw+add>mw){lines.push(cur);cur=[];cw=0;first=true;add=ww}
   cur.push({t:(first?'':' ')+w,s:s.s});cw+=add})});
  if(cur.length)lines.push(cur);return lines};

 const WP=V.pem!=='Kuasa Wajib Pajak'; /* true = Wajib Pajak, "Kuasa" dicoret */

 C('SURAT PERMOHONAN PEMECAHAN',PW/2,y,SZ+1.5,'AB');y+=LH*2;
 const xk=L+CW/2+6;
 T((V.kota||dots(16))+', '+(V.tgl||dots(14)),xk,y);y+=LH*1.6;
 T('Kepada :',xk,y);y+=LH;
 wrap('Yth. Kepala Unit Pelayanan Pemungutan Pajak Daerah Kecamatan '+(V.upp||dots(12))+' di '+(V.adm||dots(14)),R-xk).forEach(s=>{T(s,xk,y);y+=LH});
 y+=LH*.8;
 T('Yang bertanda tangan dibawah ini :',L,y);y+=LH*1.3;

 const l2=134,vx=L+l2+8,vw=R-vx;
 const lvs=(sg,v)=>{const a=wrap(v,vw);segs(L,y,sg,SZ,'A');T(':',L+l2,y);a.forEach((s,i)=>T(s,vx,y+i*LH));y+=a.length*LH+LH*.25};
 lvs([{t:'Nama '},{t:'Kuasa',s:WP},{t:'/'},{t:'Wajib Pajak',s:!WP},{t:' *)'}],V.nama||dots(60));
 lvs([{t:'No. KTP'}],V.ktp||dots(60));
 /* NOP: kotak per digit */
 {const nd=(V.nop||'').replace(/\D/g,''),gp=[2,2,3,3,3,4,1],bwx=12.5,gg=5,bh=SZ+3.5;let x=vx,k=0;
  T('NOP PBB-P2',L,y);T(':',L+l2,y);
  gp.forEach(n=>{for(let i=0;i<n;i++){const t=y-SZ*.85-1.5;
   B.line(x,t,x+bwx,t,.6);B.line(x,t+bh,x+bwx,t+bh,.6);B.line(x,t,x,t+bh,.6);B.line(x+bwx,t,x+bwx,t+bh,.6);
   const d=nd[k++];if(d)C(d,x+bwx/2,y);x+=bwx}x+=gg});
  y+=LH*1.5}
 lvs([{t:'SPPT PBB atas nama'}],V.an||dots(60));
 {const lk=wrap(V.lokasi||'',vw);while(lk.length<3)lk.push('');
  T('Letak Objek Pajak',L,y);T(':',L+l2,y);
  lk.forEach(s=>{if(s)T(s,vx,y);B.line(vx,y+2,R,y+2,.3);y+=LH*1.15});y+=LH*.1}
 lvs([{t:'No. Telp / HP'}],V.telp||dots(60));
 y+=LH*.5;

 wseg([{t:'Adalah '},{t:'Wajib Pajak',s:!WP},{t:' / '},{t:'Kuasa Wajib Pajak',s:WP},{t:' *) dengan ini mengajukan permohonan pemecahan data objek pajak PBB-P2 untuk tahun '+(V.tahun||'. . . . . . .')+' dipecah menjadi '+(V.jml||'. . . . . .')+' bidang Objek Pajak, yaitu :'}],CW).forEach(l=>{segs(L,y,l,SZ,'A');y+=LH});
 y+=LH*.6;

 /* tabel bidang */
 const TS=SZ*.92,TL=LH*.95,pad=3,xs=[L,L+30,L+258,L+320,L+382,R];
 const hh=TL+2*pad,H=2*hh,y0=y,lw=.8;
 B.line(L,y0,R,y0,lw);B.line(L,y0+H,R,y0+H,lw);
 [0,1,2,4,5].forEach(i=>B.line(xs[i],y0,xs[i],y0+H,lw));
 B.line(xs[3],y0+hh,xs[3],y0+H,lw);B.line(xs[2],y0+hh,xs[4],y0+hh,lw);
 const mid=(a,b2)=>(xs[a]+xs[b2])/2,tb=TS*.35;
 C('No.',mid(0,1),y0+H/2+tb,TS);C('Nama Wajib Pajak',mid(1,2),y0+H/2+tb,TS);
 C('Luas',mid(2,4),y0+hh/2+tb,TS);
 C('Tanah',mid(2,3),y0+hh*1.5+tb,TS);C('Bangunan',mid(3,4),y0+hh*1.5+tb,TS);
 C('Keterangan',mid(4,5),y0+H/2+tb,TS);
 y=y0+H;
 for(let i=1;i<=NB;i++){const r=V.rows[i-1];
  const na=wrap(r.n,xs[2]-xs[1]-2*pad,TS),ke=wrap(r.k,xs[5]-xs[4]-2*pad,TS);
  const h=Math.max(Math.max(na.length,ke.length,1)*TL+2*pad,TL+2*pad+3);
  B.line(L,y+h,R,y+h,lw);xs.forEach(x=>B.line(x,y,x,y+h,lw));
  const ty=y+pad+TS*.82;
  C(String(i),mid(0,1),ty,TS);
  na.forEach((s,k)=>T(s,xs[1]+pad,ty+k*TL,TS));
  if(r.t)C(r.t,mid(2,3),ty,TS);
  if(r.b)C(r.b,mid(3,4),ty,TS);
  ke.forEach((s,k)=>T(s,xs[4]+pad,ty+k*TL,TS));
  y+=h}
 y+=LH*1.1;

 T('Alasan pengajuan permohonan pemecahan PBB adalah :',L,y,SZ,'AB');y+=LH*1.15;
 const al=V.alasan?wrap(V.alasan,CW):[''];while(al.length<2)al.push('');
 al.forEach(s=>{if(s)T(s,L,y);B.line(L,y+2,R,y+2,.3);y+=LH*1.15});
 y+=LH*.5;
 wrap('Dan apabila diperlukan saya menyatakan bersedia untuk dilakukan pemeriksaan lapangan terkait pengajuan permohonan di atas.',CW).forEach(s=>{T(s,L,y);y+=LH});
 y+=LH*.6;
 const cx=R-90;
 {const sg=[{t:'Wajib Pajak',s:!WP},{t:' / '},{t:'Kuasanya',s:WP},{t:' *)'}];segs(cx-segW(sg,SZ,'A')/2,y,sg,SZ,'A')}
 const ny=y+LH+34,nm=ny+2*LH;
 C('( '+(V.ttd||V.nama||dots(24))+' )',cx,nm);
 T('*) Coret yang tidak perlu',L,nm,SZ*.85);
 if(nm+LH>PH-30)over=true;
 return{over}}
function draw(B,p,V){
 const dry={text(){},w:B.w,line(){},rect(){},path(){}};let b=10.5;
 for(;b>6.5;b-=.25){if(!lay(dry,V,b).over)break}
 lay(B,V,b)}

function pdfB(doc){const sf=f=>{doc.setFont(FJ[f][0],FJ[f][1])};return{
 text(s,x,y,sz,f){sf(f);doc.setFontSize(sz);doc.text(s,x,y)},
 w(s,sz,f){sf(f);doc.setFontSize(sz);return doc.getTextWidth(s)},
 line(a,b,c,d,w){doc.setLineWidth(w);doc.line(a,b,c,d)},
 rect(x,y,w,h,g){doc.setFillColor(g||0,g||0,g||0);doc.rect(x,y,w,h,'F');doc.setFillColor(0,0,0)},
 path(pt,w,c){const sg=[];for(let i=1;i<pt.length;i++)sg.push([pt[i][0]-pt[i-1][0],pt[i][1]-pt[i-1][1]]);doc.setLineWidth(w);doc.setLineCap('round');doc.setLineJoin('round');doc.lines(sg,pt[0][0],pt[0][1],[1,1],'S',!!c);doc.setLineCap('butt');doc.setLineJoin('miter')},
 img(){}}}
function cvB(ctx,k){const ft=(sz,f)=>{ctx.font=(f.indexOf('I')>0?'italic ':'')+(f.indexOf('B')>0?'bold ':'')+(sz*k)+'px '+(f[0]==='T'?'"Times New Roman",Times,"Liberation Serif",serif':'Arial,Helvetica,"Liberation Sans",sans-serif')};return{
 text(s,x,y,sz,f){ft(sz,f);ctx.fillText(s,x*k,y*k)},
 w(s,sz,f){ft(sz,f);return ctx.measureText(s).width/k},
 line(a,b,c,d,w){ctx.lineWidth=w*k;ctx.beginPath();ctx.moveTo(a*k,b*k);ctx.lineTo(c*k,d*k);ctx.stroke()},
 path(pt,w,c){ctx.beginPath();pt.forEach((q,i)=>i?ctx.lineTo(q[0]*k,q[1]*k):ctx.moveTo(q[0]*k,q[1]*k));if(c)ctx.closePath();ctx.lineWidth=w*k;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.lineJoin='miter';ctx.lineCap='butt'},
 rect(x,y,w,h,g){ctx.fillStyle=g?'rgb('+g+','+g+','+g+')':'#000';ctx.fillRect(x*k,y*k,w*k,h*k);ctx.fillStyle='#000'},
 img(){}}}
let Z=1;const PXW=PW*96/72;
function zoomTo(z){Z=Math.max(.3,Math.min(3,z));const w=$('pvin');w.style.transform='scale('+Z+')';
 const s=$('pvsize');s.style.width=Math.round(PXW*Z)+'px';s.style.height=Math.round(w.offsetHeight*Z)+'px';$('zl').textContent=Math.round(Z*100)+'%'}
function fit(){zoomTo(Math.min(1,($('pvbody').clientWidth-32)/PXW))}
async function tampil(){const w=$('pvin');w.innerHTML='';const V=vals();const k=PXW/PW*2;
 const cv=document.createElement('canvas');cv.width=Math.round(PW*k);cv.height=Math.round(PH*k);cv.style.cssText='display:block;width:'+PXW+'px;height:'+(PH*96/72)+'px;background:#fff;margin:0 0 14px;box-shadow:0 2px 12px #0006';
 const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.fillStyle='#000';c.strokeStyle='#000';c.textBaseline='alphabetic';c.lineCap='butt';draw(cvB(c,k),0,V);w.appendChild(cv);
 $('pv').classList.add('on');document.body.style.overflow='hidden';fit();$('pvbody').scrollTop=0}
function tutup(){$('pv').classList.remove('on');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')tutup()});
function nama(){const m=($('nama').value||'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');return 'Surat_Permohonan_Pemecahan_PBB'+(m?'_'+m:'')+'.pdf'}
async function kirim(blob,fn){
 let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:fn,data:blob})}catch(e){if(!e||e.code!=='declined')alert('PDF tidak dapat disimpan di sini.')}return}
 let touch=false;try{touch=matchMedia('(pointer:coarse)').matches}catch(e){}
 if(touch&&navigator.canShare&&window.File){
  try{const file=new File([blob],fn,{type:'application/pdf'});
   if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});return}}
  catch(e){if(e&&e.name==='AbortError')return}}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),60000)}
(function(){try{if(matchMedia('(pointer:coarse)').matches){const n=document.querySelector('.note');if(n)n.textContent+=' Di HP: jika PDF tidak terunduh, buka halaman ini langsung di Chrome/Safari (bukan di dalam WhatsApp atau aplikasi lain).'}}catch(e){}})();
async function simpanPDF(){
 const J=window.jspdf&&window.jspdf.jsPDF;if(!J){alert('Pustaka PDF belum termuat. Periksa koneksi lalu coba lagi.');return}
 const btn=$('bpdf'),t=btn.textContent;btn.disabled=true;btn.textContent='Menyiapkan…';
 try{const V=vals(),doc=new J({unit:'pt',format:[PW,PH],orientation:'portrait',compress:true});
  doc.setDrawColor(0);doc.setFillColor(0);doc.setTextColor(0);doc.setProperties({title:'Surat Permohonan Pemecahan PBB-P2'});
  draw(pdfB(doc),0,V);
  await kirim(doc.output('blob'),nama())}
 catch(e){alert('PDF gagal dibuat.')}
 finally{btn.disabled=false;btn.textContent=t}}
build();defaults();
$('upp').addEventListener('change',()=>{const o=$('upp').selectedOptions[0],g=o&&o.parentElement&&o.parentElement.tagName==='OPTGROUP'?o.parentElement.label:'';$('adm').value=g});
</script>
<script>
/* Tombol Cetak: menggambar ulang halaman yang sama dengan PDF lalu membuka dialog cetak browser */
(function(){
 var G=function(i){return document.getElementById(i)};
 function cfg(){
  if(window.CETAK_CFG)return window.CETAK_CFG;
  if(typeof PW==='number'&&typeof PH==='number')return{pw:PW+'pt',ph:PH+'pt',cw:(PW-3)+'pt',mt:'0'};
  return{pw:'210mm',ph:'297mm',cw:'207mm',mt:'0'}}
 var st=document.createElement('style');st.id='cetakcss';
 st.textContent='#pc{display:none}body.cetaking #pv{visibility:hidden}'
  +'@media print{body.cetak>*:not(#pc){display:none!important}body.cetak #pc{display:block!important}'
  +'html.cetak,body.cetak{margin:0!important;padding:0!important;background:#fff!important}'
  +'body.cetak #pc .pg{break-after:page;page-break-after:always;break-inside:avoid;text-align:center}'
  +'body.cetak #pc .pg:last-child{break-after:auto;page-break-after:auto}'
  +'body.cetak #pc canvas{display:block;margin:0 auto;height:auto;max-width:100%}}';
 document.head.appendChild(st);
 function bersih(){
  document.body.classList.remove('cetak');document.documentElement.classList.remove('cetak');
  var b=G('pc');if(b)b.innerHTML='';var p=G('cetakpg');if(p)p.remove()}
 window.addEventListener('afterprint',bersih);
 document.addEventListener('input',bersih,true);
 document.addEventListener('change',bersih,true);
 window.cetak=async function(){
  var C=cfg();
  document.body.classList.add('cetaking');
  try{
   if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
   await window.tampil();
   var src=[].slice.call(document.querySelectorAll('#pvin canvas'));
   if(!src.length)throw new Error('kosong');
   var box=G('pc');if(!box){box=document.createElement('div');box.id='pc';document.body.appendChild(box)}
   box.innerHTML='';
   src.forEach(function(c){
    var pg=document.createElement('div');pg.className='pg';
    var n=document.createElement('canvas');n.width=c.width;n.height=c.height;
    n.getContext('2d').drawImage(c,0,0);n.style.width=C.cw;
    if(C.mt&&C.mt!=='0')pg.style.paddingTop=C.mt;
    pg.appendChild(n);box.appendChild(pg)});
   window.tutup();
   var old=G('cetakpg');if(old)old.remove();
   var ps=document.createElement('style');ps.id='cetakpg';
   ps.textContent='@page{size:'+C.pw+' '+C.ph+';margin:0}';document.head.appendChild(ps);
   document.body.classList.add('cetak');document.documentElement.classList.add('cetak');
   setTimeout(function(){window.print()},80);
  }catch(e){
   try{window.tutup()}catch(x){}
   alert('Gagal menyiapkan cetak. Pastikan koneksi internet aktif (untuk memuat pustaka), lalu coba lagi.')
  }finally{document.body.classList.remove('cetaking')}
 };
 var n=document.querySelector('.note');
 if(n)n.textContent+=' Tombol “Cetak” langsung membuka dialog cetak dengan ukuran kertas sesuai formulir (di dialog, pilih printer atau “Simpan sebagai PDF”).';
})();
</script>
</body>
</html>
